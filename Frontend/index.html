<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Meta Tags -->
    <title>HikariCV — AI-Powered Resume Builder & Interview Prep</title>
    <meta name="description" content="Build ATS-optimized resumes, practice with AI mock interviews, and get real-time performance analytics. Your AI career coach powered by the latest language models." />
    <meta name="keywords" content="AI resume builder, AI interview prep, mock interviews, ATS resume, career coach, AI career tools, resume optimizer, interview practice, HikariCV" />
    <meta name="author" content="Mohit Raghav" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#fd2270" />
    <link rel="canonical" href="https://hikari-cv.vercel.app/" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://hikari-cv.vercel.app/" />
    <meta property="og:title" content="HikariCV — AI-Powered Resume Builder & Interview Prep" />
    <meta property="og:description" content="Build ATS-optimized resumes, practice with AI mock interviews, and get real-time performance analytics." />
    <meta property="og:image" content="https://hikari-cv.vercel.app/og-image.png" />
    <meta property="og:site_name" content="HikariCV" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@mohitraghav1318" />
    <meta name="twitter:creator" content="@mohitraghav1318" />
    <meta name="twitter:title" content="HikariCV — AI-Powered Resume Builder & Interview Prep" />
    <meta name="twitter:description" content="Build ATS-optimized resumes, practice with AI mock interviews, and get real-time performance analytics." />
    <meta name="twitter:image" content="https://hikari-cv.vercel.app/og-image.png" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet" />
    <!-- Material Symbols -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />

    <!-- Structured Data: WebSite (enables Google sitelinks search box) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "HikariCV",
      "url": "https://hikari-cv.vercel.app",
      "description": "AI-powered career platform for building ATS-optimized resumes and practicing mock interviews.",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://hikari-cv.vercel.app/docs?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>

    <!-- Structured Data: Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "HikariCV",
      "url": "https://hikari-cv.vercel.app",
      "logo": "https://hikari-cv.vercel.app/favicon.svg",
      "sameAs": [
        "https://x.com/mohitraghav1318",
        "https://linkedin.com/in/mohitraghav1318",
        "https://github.com/mohitraghav1318"
      ],
      "founder": {
        "@type": "Person",
        "name": "Mohit Raghav"
      }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
